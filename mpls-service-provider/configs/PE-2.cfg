interface Loopback0
 description Router-ID / LDP ID
 ip address 10.255.0.3 255.255.255.255
 ip router isis networkbyte
!
interface GigabitEthernet0/0
 description Naar P1 (MPLS)
 ip address 10.0.1.2 255.255.255.252
 ip router isis networkbyte
 duplex auto
 speed auto
 media-type rj45
 mpls ip
 isis network point-to-point
!
interface GigabitEthernet0/1
 description Naar CE2 (geen MPLS!)
 vrf forwarding KLANT-A
 ip address 192.168.2.1 255.255.255.252
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/2
 ip address 10.0.3.1 255.255.255.252
 ip router isis networkbyte
 duplex auto
 speed auto
 media-type rj45
 mpls ip
 isis network point-to-point
!
interface GigabitEthernet0/3
 vrf forwarding KLANT-B
 ip address 192.168.12.1 255.255.255.252
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/4
 no ip address
 shutdown
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/5
 no ip address
 shutdown
 duplex auto
 speed auto
 media-type rj45
!
router isis networkbyte
 net 49.0001.0000.0000.0003.00
 is-type level-2-only
 metric-style wide
!
router bgp 65100
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 10.255.0.1 remote-as 65100
 neighbor 10.255.0.1 update-source Loopback0
 !
 address-family ipv4
 exit-address-family
 !
 address-family vpnv4
  neighbor 10.255.0.1 activate
  neighbor 10.255.0.1 send-community extended
 exit-address-family
 !
 address-family ipv4 vrf KLANT-A
  redistribute connected
  redistribute static
 exit-address-family
 !
 address-family ipv4 vrf KLANT-B
  redistribute connected
  redistribute static
 exit-address-family
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
ip route vrf KLANT-A 10.2.0.0 255.255.255.0 192.168.2.2
ip route vrf KLANT-A 172.16.2.1 255.255.255.255 192.168.2.2
ip route vrf KLANT-B 10.12.0.0 255.255.255.0 192.168.12.2
ip route vrf KLANT-B 172.16.12.1 255.255.255.255 192.168.12.2
